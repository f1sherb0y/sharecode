services:
  # ===========================
  # Database Services
  # ===========================
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sharecode
      POSTGRES_USER: sharecode_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharecode}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sharecode_app -d sharecode" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Judge0 Database (separate from app database)
  judge0-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0secret}
    volumes:
      - judge0_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ===========================
  # Code Execution (Judge0)
  # ===========================
  judge0-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - judge0_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  judge0-server:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_MAX_THREADS: 8
      SECRET_KEY_BASE: ${JUDGE0_SECRET_KEY:-your-secret-key-base-here}
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0secret}
      REDIS_HOST: judge0-redis
      REDIS_PORT: 6379
      ENABLE_WAIT_RESULT: "true"
      ENABLE_BATCHED_SUBMISSIONS: "true"
      MAX_QUEUE_SIZE: 100
      CPU_TIME_LIMIT: 10
      CPU_EXTRA_TIME: 5
      WALL_TIME_LIMIT: 20
      MEMORY_LIMIT: 256000
      STACK_LIMIT: 128000
      MAX_PROCESSES_AND_OR_THREADS: 60
      MAX_FILE_SIZE: 4096
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      ENABLE_NETWORK: "false"
      MAINTENANCE_MODE: "false"
      AUTHN_HEADER: X-Auth-Token
      AUTHN_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
      AUTHZ_HEADER: X-Auth-User
      AUTHZ_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
    privileged: true
    expose:
      - "2358"
    networks:
      - backend

  judge0-worker:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    depends_on:
      judge0-server:
        condition: service_started
      judge0-redis:
        condition: service_healthy
    command: ["./scripts/workers"]
    environment:
      RAILS_ENV: production
      RAILS_MAX_THREADS: 8
      SECRET_KEY_BASE: ${JUDGE0_SECRET_KEY:-your-secret-key-base-here}
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:-judge0secret}
      REDIS_HOST: judge0-redis
      REDIS_PORT: 6379
      ENABLE_WAIT_RESULT: "true"
      ENABLE_BATCHED_SUBMISSIONS: "true"
      CPU_TIME_LIMIT: 10
      CPU_EXTRA_TIME: 5
      WALL_TIME_LIMIT: 20
      MEMORY_LIMIT: 256000
      STACK_LIMIT: 128000
      MAX_PROCESSES_AND_OR_THREADS: 60
      MAX_FILE_SIZE: 4096
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      ENABLE_NETWORK: "false"
    privileged: true
    networks:
      - backend

  # ===========================
  # Application Services
  # ===========================
  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sharecode_app:${POSTGRES_PASSWORD:-sharecode}@postgres:5432/sharecode?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sharecode.local}
      JUDGE0_URL: http://judge0-server:2358
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
    expose:
      - "3001"
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        # Empty values = use relative URLs (same-origin)
        VITE_API_URL: ""
        VITE_WS_URL: ""
        VITE_ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    restart: unless-stopped
    depends_on:
      - server
    expose:
      - "80"
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - server
    networks:
      - backend
    environment:
      DOMAIN: ${DOMAIN:-localhost}

volumes:
  pgdata:
  judge0_pgdata:
  judge0_redis:
  caddy_data:
  caddy_config:


networks:
  backend:
    driver: bridge
