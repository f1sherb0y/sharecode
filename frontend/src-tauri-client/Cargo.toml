[package]
name = "sharecode-client"
# The app's only version (tauri.conf.json sets none): the installers, the updater and the exe's
# file properties all use it. Raise it for every release (see BUILD.md).
version = "0.2.0"
description = "ShareCode desktop client for customers: join a session from an invitation"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sharecode_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Tauri crates stay on the minor release of @tauri-apps/api (2.10); the CLI refuses mismatches.
[build-dependencies]
tauri-build = { version = "~2.5.6", features = [] }

[dependencies]
# macos-private-api: transparent window, needed for the adjustable window opacity on macOS.
tauri = { version = "~2.10.3", features = ["macos-private-api"] }
# Signed in-app updates (see plugins.updater in tauri.conf.json) and the restart after one.
tauri-plugin-updater = "~2.10.1"
tauri-plugin-process = "~2.3.1"
tauri-plugin-global-shortcut = "~2.3.1"
# generate_context! embeds the plugins' configuration as JSON; the stealth state reaches the title
# bar as JSON too.
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSWindow", "NSScreen", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSNotification", "NSOperation", "NSObject", "NSString", "block2"] }

# Camouflage on Windows needs the window manager directly: capture exclusion, the extended style
# bits that make the window unfocusable and click-through, and a window procedure that keeps those
# bits when tao rewrites the style. tao already depends on the same `windows` release, so this adds
# features to one shared crate rather than a second copy.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
