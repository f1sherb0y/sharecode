<!doctype html>
<html lang="en">
  <head>
    <script>window.EXCALIDRAW_ASSET_PATH = "https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.18.1/dist/prod/";</script>
    <meta charset="UTF-8" />
    <script>
      // Apply before the app/CSS loads to avoid a flash of the opposite theme (same as index.html).
      (() => {
        let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
          const saved = JSON.parse(localStorage.getItem('theme-storage') || 'null')?.state?.theme;
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch { /* Storage can be unavailable in restricted browser contexts. */ }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShareCode</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
