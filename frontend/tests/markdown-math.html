<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Markdown math regression fixture</title></head>
  <body class="md-editor">
    <div id="editor"></div>
    <script type="module">
      import { Editor, rootCtx, defaultValueCtx, editorViewCtx, serializerCtx } from '@milkdown/kit/core'
      import { commonmark } from '@milkdown/kit/preset/commonmark'
      import { gfm } from '@milkdown/kit/preset/gfm'
      import { clipboard } from '@milkdown/kit/plugin/clipboard'
      import { history } from '@milkdown/kit/plugin/history'
      import { replaceAll, insert } from '@milkdown/kit/utils'
      import { TextSelection } from '@milkdown/kit/prose/state'
      import { collab, collabServiceCtx } from '@milkdown/plugin-collab'
      import * as Y from 'yjs'
      import { mathPlugins } from '../src/lib/milkdown-math'
      import '../src/styles/markdown.css'
      import '@milkdown/kit/prose/view/style/prosemirror.css'

      const editor = await Editor.make()
        .config((ctx) => {
          ctx.set(rootCtx, document.querySelector('#editor'))
          ctx.set(defaultValueCtx, '')
        })
        .use(commonmark).use(gfm).use(clipboard).use(history).use(mathPlugins)
        .create()
      const view = editor.action((ctx) => ctx.get(editorViewCtx))
      window.mathTest = {
        replace: (markdown) => editor.action(replaceAll(markdown)),
        insert: (markdown) => editor.action(insert(markdown)),
        markdown: () => editor.action((ctx) => ctx.get(serializerCtx)(view.state.doc)),
        json: () => view.state.doc.toJSON(),
        readonly: (value) => view.setProps({ editable: () => !value }),
        selectText: () => view.dispatch(view.state.tr.setSelection(
          TextSelection.create(view.state.doc, view.state.selection.$from.start(), view.state.selection.$from.end()),
        )),
        async collaborate() {
          const docs = [new Y.Doc(), new Y.Doc()]
          const editors = []
          const roots = []
          try {
            for (const [index, doc] of docs.entries()) {
              if (index === 1) Y.applyUpdate(doc, Y.encodeStateAsUpdate(docs[0]))
              const root = document.body.appendChild(document.createElement('div'))
              roots.push(root)
              const peer = await Editor.make().config((ctx) => ctx.set(rootCtx, root))
                .use(commonmark).use(gfm).use(mathPlugins).use(collab).create()
              editors.push(peer)
              peer.action((ctx) => ctx.get(collabServiceCtx)
                .bindDoc(doc).applyTemplate('$x^2$\n\n$$\nE = mc^2\n$$').connect())
            }
            editors.forEach((peer, index) => peer.action((ctx) => {
              const peerView = ctx.get(editorViewCtx)
              peerView.dispatch(peerView.state.tr.insertText(index === 0 ? 'a+' : 'b+', 2))
            }))
            const updates = docs.map((doc) => Y.encodeStateAsUpdate(doc))
            Y.applyUpdate(docs[0], updates[1])
            Y.applyUpdate(docs[1], updates[0])
            return editors.map((peer, index) => ({
              markdown: peer.action((ctx) => ctx.get(serializerCtx)(ctx.get(editorViewCtx).state.doc)),
              preview: roots[index].querySelector('.md-math-inline annotation').textContent,
              blocks: roots[index].querySelectorAll('.md-math-block math[display="block"]').length,
            }))
          } finally {
            for (const peer of editors) await peer.destroy()
            for (const doc of docs) doc.destroy()
            for (const root of roots) root.remove()
          }
        },
      }
    </script>
  </body>
</html>
