name: Client release

# A client-v<version> tag builds the Windows customer client (the Go/MyGo host in
# frontend/src-mygo-client) as that version, signs its update and uploads the installer to that
# version's draft in 管理后台 → 客户端发布. Publishing stays a manual click there: the CI token
# can open drafts and add files to them, nothing else.
# Run by hand, it builds the development client and uploads nothing to the release server.
# The Tauri client is not built here any more; client-macos.yml still builds its macOS DMG by hand.
on:
  push:
    tags: ['client-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-release-${{ github.ref }}

env:
  SERVER: https://collabcode.cc

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: Read the version from the tag
        run: |
          version=''
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#client-v}
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not client-v<major>.<minor>.<patch>"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: frontend/src-mygo-client/go.mod
          cache-dependency-path: frontend/src-mygo-client/go.sum
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install meeting helper targets
        run: rustup target add i686-pc-windows-msvc x86_64-pc-windows-msvc
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup could not be installed' }
          }
      - name: Build the installer
        working-directory: frontend/src-mygo-client
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          # A tag builds the released identity with a signed update; by hand, the development client.
          if ($env:VERSION) { .\build-windows.ps1 -Release -Version $env:VERSION } else { .\build-windows.ps1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-windows
          path: |
            build/mygo-client/*-setup.exe
            build/mygo-client/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 7

  upload:
    if: github.event_name == 'push'
    needs: [version, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
      - name: Upload to the draft
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CI_TOKEN: ${{ secrets.CLIENT_RELEASES_CI_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # An annotated tag's message becomes the notes of a new draft (a rerun keeps them).
          notes=''
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          if [[ "$(jq -r .object.type <<<"$ref")" == tag ]]; then
            notes=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .message)
          fi
          draft=$(curl --fail-with-body -sS -X PUT "$SERVER/api/ci/client-releases/$VERSION" \
            -H "Authorization: Bearer $CI_TOKEN" -H 'Content-Type: application/json' \
            --data "$(jq -n --arg notes "$notes" '{notes: $notes}')")
          id=$(jq -r .release.id <<<"$draft")

          # One file per system and kind: a rerun replaces what an earlier run uploaded.
          upload() {
            local platform=$1 kind=$2 file=$3
            local fields=(-F "platform=$platform" -F "kind=$kind")
            [[ ! -f "$file.sig" ]] || fields+=(-F "signature=<$file.sig")
            if ! curl --fail-with-body -sS -o response.json -H "Authorization: Bearer $CI_TOKEN" \
              "${fields[@]}" -F "file=@$file" "$SERVER/api/admin/client-releases/$id/assets"; then
              cat response.json >&2
              return 1
            fi
            echo "Uploaded ${file##*/} as $platform $kind"
          }
          one() {
            [[ $# -eq 1 ]] || { echo "Expected one file, found $#: $*" >&2; return 1; }
            echo "$1"
          }
          shopt -s nullglob
          setup=$(one dist/client-windows/*_x64-setup.exe)
          upload windows-x86_64 installer "$setup"
          echo "Draft $VERSION is ready: 管理后台 → 客户端发布"
