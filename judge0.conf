# Judge0 Configuration for Development
# See: https://github.com/judge0/judge0/blob/master/judge0.conf

# Database Configuration
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0_dev_password

# Redis Configuration (using URL format)
REDIS_URL=redis://judge0-redis:6379/0

# Security
SECRET_KEY_BASE=dev-secret-key-base-change-in-production-a1b2c3d4e5f6

# Execution Limits
CPU_TIME_LIMIT=10
CPU_EXTRA_TIME=5
WALL_TIME_LIMIT=20
MEMORY_LIMIT=256000
STACK_LIMIT=128000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_FILE_SIZE=4096

# Features
ENABLE_WAIT_RESULT=true
ENABLE_BATCHED_SUBMISSIONS=true
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
ENABLE_NETWORK=false

# Queue
MAX_QUEUE_SIZE=100

# Misc
MAINTENANCE_MODE=false
RAILS_ENV=development
RAILS_MAX_THREADS=8

# Disable telemetry for self-hosted
JUDGE0_TELEMETRY_ENABLE=false
