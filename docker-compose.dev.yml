services:
  postgres:
    image: postgres:17-alpine
    container_name: sharecode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sharecode
      POSTGRES_PASSWORD: sharecode_dev_password
      POSTGRES_DB: sharecode
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharecode"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sharecode-pgadmin
    restart: unless-stopped
    user: root
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres

  # ===========================
  # Piston Code Execution
  # ===========================
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: sharecode-piston
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - ./data/piston:/piston/packages

networks:
  default:
    name: sharecode-network
