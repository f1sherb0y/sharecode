<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBFAFC"/><stop offset="1" stop-color="#F3F1F8"/>
    </linearGradient>
    <linearGradient id="ink" x1="322" y1="0" x2="398" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/><stop offset=".5" stop-color="#FB7185"/><stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#1B1530" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="720" height="420" fill="url(#paper)"/>
  <circle cx="650" cy="35" r="250" fill="#FDE68A" opacity=".18"/>
  <circle cx="85" cy="400" r="260" fill="#C026D3" opacity=".06"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <text x="360" y="72" text-anchor="middle" font-size="28" font-weight="700" letter-spacing="-.6" fill="#15161D">ShareCode</text>
    <text x="360" y="101" text-anchor="middle" font-size="15" fill="#5B5E6B">Drag to Applications · 拖到“应用程序”</text>

    <rect x="118" y="145" width="144" height="160" rx="30" fill="#fff" fill-opacity=".75" stroke="#1B1530" stroke-opacity=".06" filter="url(#lift)"/>
    <rect x="458" y="145" width="144" height="160" rx="30" fill="#fff" fill-opacity=".75" stroke="#1B1530" stroke-opacity=".06" filter="url(#lift)"/>
    <g fill="none" stroke="url(#ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M322 203l14 14-14 14" opacity=".35"/>
      <path d="M350 203l14 14-14 14" opacity=".65"/>
      <path d="M378 203l14 14-14 14"/>
    </g>

    <text x="360" y="380" text-anchor="middle" font-size="14" fill="#5B5E6B">If macOS asks, choose Open Anyway · 如提示，请点“仍要打开”</text>
  </g>
</svg>
