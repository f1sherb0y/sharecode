<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660">
  <defs>
    <!-- The logo's sunset (src/assets/sharecode-logo.svg), as soft light over paper. -->
    <radialGradient id="sun" cx="600" cy="40" r="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A" stop-opacity=".55"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="430" cy="230" r="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185" stop-opacity=".22"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="80" cy="470" r="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C026D3" stop-opacity=".16"/><stop offset="1" stop-color="#C026D3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="322" y1="0" x2="398" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/><stop offset=".5" stop-color="#FB7185"/><stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1B1530" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="720" height="660" fill="#FBFAFC"/>
  <rect width="720" height="660" fill="url(#sun)"/>
  <rect width="720" height="660" fill="url(#rose)"/>
  <rect width="720" height="660" fill="url(#violet)"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <text x="360" y="66" text-anchor="middle" font-size="28" font-weight="700" letter-spacing="-.6" fill="#15161D">ShareCode</text>
    <text x="360" y="96" text-anchor="middle" font-size="15" fill="#5B5E6B">Drag to Applications · 拖到“应用程序”</text>

    <!-- Finder places the real icons (96 px, label below) at (190, 210) and (530, 210). -->
    <rect x="118" y="138" width="144" height="160" rx="30" fill="#fff" fill-opacity=".72" stroke="#1B1530" stroke-opacity=".06" filter="url(#lift)"/>
    <rect x="458" y="138" width="144" height="160" rx="30" fill="#fff" fill-opacity=".72" stroke="#1B1530" stroke-opacity=".06" filter="url(#lift)"/>
    <g fill="none" stroke="url(#ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M322 196l14 14-14 14" opacity=".35"/>
      <path d="M350 196l14 14-14 14" opacity=".65"/>
      <path d="M378 196l14 14-14 14"/>
    </g>

    <rect x="40" y="320" width="640" height="92" rx="22" fill="#fff" fill-opacity=".8" stroke="#1B1530" stroke-opacity=".06" filter="url(#lift)"/>
    <circle cx="92" cy="366" r="22" fill="url(#ink)" opacity=".14"/>
    <g fill="none" stroke="#C0265F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M92 354l-9 4v6c0 6 4 10 9 12 5-2 9-6 9-12v-6z"/>
      <path d="M88 365l3 3 5-6"/>
    </g>
    <text x="130" y="346" font-size="13" font-weight="600" fill="#6B6E7B">First launch blocked? · 首次打开被拦截？</text>
    <text x="130" y="372" font-size="15" font-weight="600" fill="#15161D">System Settings → Privacy &amp; Security → Open Anyway</text>
    <text x="130" y="397" font-size="14" fill="#5B5E6B">系统设置 → 隐私与安全性 → 仍要打开</text>

    <rect x="40" y="426" width="640" height="188" rx="22" fill="#fff" fill-opacity=".8" stroke="#1B1530" stroke-opacity=".06" filter="url(#lift)"/>
    <text x="64" y="454" font-size="16" font-weight="700" fill="#15161D">开启键盘快捷键 · Enable keyboard shortcuts</text>
    <g font-size="13" fill="#5B5E6B">
      <text x="64" y="483" font-weight="600" fill="#15161D">① 首次启动自动打开“输入监控”和授权引导</text>
      <text x="84" y="503">First launch opens Input Monitoring and the setup guide.</text>
      <text x="64" y="529" font-weight="600" fill="#15161D">② 将引导中的应用拖入列表，打开应用旁的开关</text>
      <text x="84" y="549">Drag the app from the guide into the list, then enable it.</text>
      <text x="64" y="575" font-weight="600" fill="#15161D">③ 按提示重启，再点“测试快捷键”，按 Ctrl + Shift + F</text>
      <text x="84" y="595">Reopen if prompted → Test shortcut → Ctrl + Shift + F within 15s</text>
    </g>

    <text x="360" y="642" text-anchor="middle" font-size="11" fill="#6B6E7B">Ctrl + Shift + F · 穿透 / Click-through　　Ctrl + Shift + Q · 退出 / Quit</text>
  </g>
</svg>
